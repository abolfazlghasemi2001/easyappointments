# ---------------------------------------------------------------------------
# nginx virtual host of nobat.hoosna1402.ir (docker-compose.prod.yml, service "web").
#
# Mounted as /etc/nginx/conf.d/default.conf into the nginx container.
#
# Security model of this file:
#
#   1. Only "/index.php" is executed. Every other ".php" file (there are none in
#      the web root, but the rule also protects a future one) returns 404, so a
#      stray script can never be reached from the internet.
#   2. Application internals are never served as static content:
#      /application, /system, /vendor, /tests, /dev, /docs, /scripts, /docker,
#      /deploy, /storage, /node_modules, config.php, .env, VCS files, ...
#      The audit (docs/fa/step-00-audit.md, gap 33) found that the previous
#      configuration exposed /storage/sessions (session hijacking),
#      /storage/backups (full database dumps) and /config.php.
#   3. Everything else falls through to the front controller ("try_files").
#
# The client address is taken from the "X-Forwarded-For" header of Caddy, so the
# rate limiting and the audit log of the application see the real customer IP
# and not the address of the reverse proxy container.
#
# Fork addition - not part of the upstream project (see CUSTOMIZATIONS.md).
# ---------------------------------------------------------------------------

# Trust the private docker networks only: Caddy is the only component in front of
# this server, so a forged header from the internet can never spoof the client IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name nobat.hoosna1402.ir _;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # The application accepts uploads up to 32 MB (see php-prod.ini).
    client_max_body_size 32M;
    client_body_timeout 60s;

    # Do not use the "always" flag: the application itself must be able to send
    # its own headers, and the TLS related header is set by Caddy.
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    access_log /var/log/nginx/nobat.access.log;
    error_log  /var/log/nginx/nobat.error.log warn;

    # -----------------------------------------------------------------------
    # 1. Application internals: never served, never executed.
    # -----------------------------------------------------------------------

    location ~ ^/(application|system|vendor|tests|dev|docs|scripts|docker|deploy|storage|node_modules|\.git|\.github)(/|$) {
        return 404;
    }

    # Configuration, lock files and documentation in the web root.
    location ~ ^/(config\.php|config-loader\.php|config-sample\.php|composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|gulpfile\.js|babel\.config\.json|openapi\.yml|README\.md|CHANGELOG\.md|CUSTOMIZATIONS\.md|LICENSE)$ {
        return 404;
    }

    # Hidden files (.env, .gitignore, .htaccess, backup files, editor files).
    location ~ /\. {
        return 404;
    }

    location ~* \.(env|sqlite|sqlite3|sql|log|bak|old|swp|tar|tgz|gz|zip|ini|lock|md|json|yml|yaml|sh|scss|map)$ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # 2. The front controller. Everything the application answers is handled
    #    by /index.php, including the PATH_INFO form (/index.php/booking).
    # -----------------------------------------------------------------------

    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # The original scheme and client address (Caddy terminates TLS).
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;

        fastcgi_read_timeout 90s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -----------------------------------------------------------------------
    # 3. Any other PHP file returns 404 instead of being executed.
    # -----------------------------------------------------------------------

    location ~ \.php$ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # 4. Static assets and the front controller fallback.
    # -----------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long living asset cache. The application appends a version query string to
    # its assets (assets_url()), so a changed file is fetched again at once.
    location ^~ /assets/ {
        try_files $uri =404;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 7d;
    }

    # -----------------------------------------------------------------------
    # 5. Diagnostics (only reachable from inside the docker network).
    #    The health endpoints are used by the container health checks and by
    #    scripts/deploy.sh, never by a browser of a customer.
    # -----------------------------------------------------------------------

    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        access_log off;

        try_files $uri /index.php?$query_string;
    }

    location = /nginx-health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        access_log off;

        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
