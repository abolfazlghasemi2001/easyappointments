; ---------------------------------------------------------------------------
; php-fpm pool settings of the production container.
;
; Mounted by docker-compose.prod.yml as
; /usr/local/etc/php-fpm.d/zz-prod.conf
;
; The file overrides the matching directives of the default "www" pool of the
; official php-fpm image, therefore it must start with the [www] section.
;
; The server has 2 GB of RAM and hosts a second (Node.js) application, so the
; pool is intentionally small. Measure with "docker stats" after the deployment
; and raise pm.max_children only together with the swap size.
;
; Fork addition - not part of the upstream project (see CUSTOMIZATIONS.md).
; ---------------------------------------------------------------------------

[www]

; Dynamic pool: a handful of workers is enough for an appointment scheduler.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle the workers regularly, so a slow memory leak cannot grow forever.
pm.max_requests = 300

; A single request may take at most 90 seconds (the PHP max_execution_time is 60).
request_terminate_timeout = 90s

; The environment of the container (docker compose ".env") must reach PHP.
clear_env = no

; The pool listens on TCP 9000 inside the private docker network only. The port
; is never published on the host, so nginx and the php-fpm container can talk to
; each other while the outside world cannot reach the pool.
listen = 9000

; Log the slow requests, so that a performance problem is visible in the logs.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Available for monitoring from inside the docker network:
;   curl http://app:9000/fpm-status?full
pm.status_path = /fpm-status
ping.path = /fpm-ping
