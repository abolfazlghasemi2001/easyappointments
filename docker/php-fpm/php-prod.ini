; ---------------------------------------------------------------------------
; PHP settings of the production container.
;
; Mounted by docker-compose.prod.yml as
; /usr/local/etc/php/conf.d/99-prod.ini
;
; Fork addition - not part of the upstream project (see CUSTOMIZATIONS.md).
; ---------------------------------------------------------------------------

; Never print errors to the browser of a customer.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; The application runs behind nginx, so the real client address comes from the
; reverse proxy. REMOTE_ADDR is the nginx container inside the docker network.
expose_php = Off

; A 2 GB server hosts the Node.js application of the main site as well, so the
; limits are intentionally conservative.
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 5000

; Sessions are stored in the database directory of the application.
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; UTF-8 is the only working charset for the Persian interface.
default_charset = UTF-8
mbstring.language = neutral
date.timezone = Asia/Tehran

; OPcache: the deployment reloads php-fpm, so validating timestamps is enough.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

; Realpath cache: the code is bind mounted, so it must not be cached forever.
realpath_cache_size = 4096k
realpath_cache_ttl = 120

; Disable the (unused) mail functions of PHP; the application sends mail through
; its own settings. They are not compiled in for security.
